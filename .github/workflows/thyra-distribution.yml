name: Thyra distribution

# Builds the Herdr binaries that Thyra's installers pin and publishes them as a
# release of this fork, independent of the official herdrdev release process.
#
# Publish: push an annotated tag v<Cargo.toml version>-thyra.<n> on the commit
# to ship, for example v0.9.1-thyra.1. Binaries embed the full fork version
# identity (`herdr 0.9.1-thyra.1`) for update comparisons.
# Then pin it in Thyra: bun scripts/pin-herdr.ts pin Yubo-Cao/herdr <tag>.
# Dry run: dispatch this workflow on any branch; it builds and verifies every
# asset and keeps them as workflow artifacts without publishing.
#
# Assets use the official names that Thyra's installers and
# `thyra herdr setup` expect: herdr-linux-x86_64, herdr-linux-aarch64,
# herdr-macos-x86_64, herdr-macos-aarch64, herdr-windows-x86_64.zip, plus
# SHA256SUMS and latest.json. Only the default GITHUB_TOKEN is used.

on:
  push:
    tags: ["v*-thyra.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thyra-distribution-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  validate:
    if: github.repository != 'herdrdev/herdr'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Check the tag against Cargo.toml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-thyra\.[0-9]+$ ]]; then
              echo "error: tag must look like v${version}-thyra.<n>" >&2
              exit 1
            fi
            if [ "${BASH_REMATCH[1]}" != "$version" ]; then
              echo "error: tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test update manifest generation
        run: python3 -m unittest scripts.test_thyra_distribution

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: herdr-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: herdr-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            name: herdr-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: "true"
      HERDR_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: thyra-distribution-${{ matrix.target }}

      - name: Remove Zig caches
        shell: bash
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package and verify the Linux binary
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/herdr" "${{ matrix.name }}"
          file "${{ matrix.name }}"
          # Static musl binaries run on glibc and musl distributions alike.
          # ldd cannot inspect foreign-architecture binaries; file(1) can.
          file "${{ matrix.name }}" | grep -q "statically linked"
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-musl ]; then
            test "$("./${{ matrix.name }}" --version)" = "herdr $HERDR_VERSION"
          fi

      - name: Package and verify the macOS binary
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/herdr" "${{ matrix.name }}"
          file "${{ matrix.name }}"
          codesign --verify --strict "${{ matrix.name }}" || codesign --force --sign - "${{ matrix.name }}"
          codesign --verify --strict "${{ matrix.name }}"
          if [ "${{ matrix.target }}" = aarch64-apple-darwin ]; then
            test "$("./${{ matrix.name }}" --version)" = "herdr $HERDR_VERSION"
          fi

      - name: Package and verify the Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "herdr-windows-x86_64"
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\${{ matrix.target }}\release\herdr.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath ${{ matrix.name }}
          $version = (& (Join-Path $stage "herdr.exe") --version | Out-String).Trim()
          if ($version -ne "herdr $env:HERDR_VERSION") {
            throw "Packaged Windows binary has unexpected version identity: $version"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.repository != 'herdrdev/herdr' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require repository admins for publishing and reruns
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for actor in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$actor/permission" --jq .permission)"
            if [ "$permission" != "admin" ]; then
              echo "error: $actor must have repository admin permission to publish" >&2
              exit 1
            fi
          done

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          path: source

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: assets
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: assets
        run: |
          set -euo pipefail
          expected="herdr-linux-aarch64 herdr-linux-x86_64 herdr-macos-aarch64 herdr-macos-x86_64 herdr-windows-x86_64.zip"
          test "$(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')" = "$expected"
          # shellcheck disable=SC2086 # Expand the fixed asset list.
          sha256sum $expected > SHA256SUMS
          cat SHA256SUMS

      - name: Write latest.json
        working-directory: source
        run: python3 -m scripts.thyra_distribution --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --assets ../assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          assets/herdr-linux-x86_64
          assets/herdr-linux-aarch64
          assets/herdr-macos-x86_64
          assets/herdr-macos-aarch64
          assets/herdr-windows-x86_64.zip
          assets/SHA256SUMS
          assets/latest.json
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --latest
          --title "Herdr $GITHUB_REF_NAME for Thyra"
          --notes "Herdr fork build pinned by Thyra's installers (https://github.com/Yubo-Cao/thyra#quick-start), which verify these assets against the SHA-256 values recorded in each Thyra release."
